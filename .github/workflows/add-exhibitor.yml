name: 添加参会企业
run-name: 更新并发布展位查询

on:
  workflow_dispatch:
    inputs:
      company:
        description: 单位全称
        required: true
        type: string
      booth:
        description: 展位号（例如 A10，每区 1–34 号）
        required: true
        type: string
  push:
    branches: [main]
    paths: [index.html]

permissions: {}

concurrency:
  group: github-pages
  queue: max
  cancel-in-progress: false

jobs:
  add:
    name: 校验并添加单位
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: 校验并保存展位数据
        env:
          COMPANY_NAME: ${{ inputs.company }}
          BOOTH_CODE: ${{ inputs.booth }}
        run: |
          python3 .github/scripts/add_exhibitor.py index.html
          if ! git diff --quiet -- index.html; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m '更新参会企业展位' -- index.html
            git push origin HEAD:main
          fi

  build:
    name: 准备公开查询页
    needs: add
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.add.result == 'success' || needs.add.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: 提取公开网页
        run: |
          mkdir public
          cp index.html public/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    name: 发布展位查询页
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
