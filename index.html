  <style>
:root {
  color-scheme: light;
  font-family: Inter, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  color: #172c23;
  background: #f2f5ef;
  -webkit-text-size-adjust: 100%;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; padding-bottom: 48px; }
button, input { font: inherit; }
button { cursor: pointer; }
button:focus-visible { outline: 3px solid #1c805a; outline-offset: 3px; }
.shell { width: min(100% - 48px, 900px); margin-inline: auto; }

.masthead { display: flex; align-items: center; min-height: 74px; }
.brand { display: flex; align-items: center; gap: 11px; font-size: 15px; font-weight: 700; letter-spacing: .06em; }
.brand { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.brand-mark {
  width: 34px;
  height: 34px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 3px;
  padding: 8px;
  border-radius: 9px;
  background: #204c39;
}
.brand-mark i { background: #daefd2; border-radius: 1px; }
.brand-mark i:nth-child(2) { background: #8ed4a6; }

.hero {
  position: relative;
  display: flex;
  min-height: 236px;
  padding: 44px 46px 67px;
  overflow: hidden;
  border-radius: 23px;
  background: radial-gradient(ellipse at 100% 30%, #2c634a, transparent 65%), #153c2c;
  color: #f8fdf6;
}
.hero-copy { position: relative; z-index: 1; align-self: center; }
h1 { margin: 0 0 13px; font-size: clamp(36px, 6vw, 57px); letter-spacing: .02em; line-height: 1.13; }
.hero p { margin: 0; font-size: 16px; line-height: 1.6; color: #d3e7d7; }
.booth-art {
  position: absolute;
  right: 40px;
  top: 31px;
  width: 214px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  transform: rotate(-12deg);
}
.booth-art span {
  aspect-ratio: 1;
  border-radius: 11px;
  border: 1px solid #b6e5b852;
  background: #c9efc211;
}
.booth-art .booth-highlight {
  display: grid;
  place-items: center;
  border-color: #b3e4a8;
  background: #b3e4a8;
}
.booth-highlight::after {
  content: "";
  width: 15px;
  height: 15px;
  border: 4px solid #245a3e;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-34deg);
}

.search-card {
  position: relative;
  margin: -29px 20px 0;
  padding: 27px 28px 24px;
  border: 1px solid #dce5dc;
  border-radius: 17px;
  background: #fff;
  box-shadow: 0 10px 26px #153c2c0e;
}
label { display: block; margin-bottom: 9px; font-size: 14px; font-weight: 700; }
.search-row { display: flex; gap: 10px; }
.input-wrap {
  min-width: 0;
  flex: 1;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 12px 0 15px;
  min-height: 54px;
  border: 1px solid #bfcfc4;
  border-radius: 10px;
  background: #fbfdfb;
}
.input-wrap:focus-within { border-color: #2a7854; outline: 2px solid #bde2c9; }
.magnifier {
  width: 15px;
  height: 15px;
  position: relative;
  flex: none;
  border: 1.8px solid #4c695a;
  border-radius: 50%;
  margin: 0 2px 3px 0;
}
.magnifier::after {
  content: "";
  position: absolute;
  width: 6px;
  height: 1.8px;
  top: 11px;
  left: 10px;
  background: #4c695a;
  border-radius: 2px;
  transform: rotate(45deg);
  transform-origin: left center;
}
input {
  flex: 1;
  width: 100%;
  min-width: 0;
  min-height: 50px;
  padding: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: #172c23;
  font-size: 16px;
  appearance: none;
}
input::placeholder { color: #64786c; opacity: 1; }
input::-webkit-search-cancel-button { display: none; }
.clear-button {
  flex: none;
  width: 34px;
  height: 36px;
  padding: 0;
  color: #456458;
  font-size: 24px;
  line-height: 1;
  background: transparent;
  border: 0;
  border-radius: 5px;
}
.clear-button:hover { background: #e9f3eb; }
.search-button {
  flex: none;
  min-width: 90px;
  padding: 0 16px;
  border: 0;
  border-radius: 10px;
  background: #256345;
  color: #fff;
  font-weight: 700;
}
.search-button:hover { background: #174f35; }
.form-message { margin: 9px 0 0; color: #a13026; font-size: 14px; }
.examples { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 16px; }
.examples span { margin-right: 4px; color: #52685a; font-size: 13px; }
.examples button {
  min-height: 32px;
  padding: 3px 11px;
  background: #f0f6ef;
  color: #24523d;
  border: 1px solid #deeadc;
  border-radius: 999px;
  font-size: 13px;
}
.examples button:hover { background: #e1efe0; }
.results { margin: 23px 20px 0; }
.result-status { margin: 0 0 11px; color: #435f50; font-size: 14px; line-height: 1.5; }
.result-list { display: grid; gap: 9px; list-style: none; margin: 0; padding: 0; }
.result-item {
  display: grid;
  grid-template-columns: 88px minmax(0, 1fr);
  gap: 18px;
  align-items: center;
  padding: 11px 16px 11px 11px;
  border: 1px solid #dce5dc;
  border-radius: 12px;
  background: #fff;
}
.booth {
  display: grid;
  justify-items: center;
  gap: 2px;
  padding: 8px 4px;
  border-radius: 8px;
  color: #164832;
  background: #e7f2e4;
}
.booth small { font-size: 12px; line-height: 1.3; }
.booth strong { font-size: 29px; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.company { margin: 0; font-weight: 700; font-size: 16px; line-height: 1.5; overflow-wrap: anywhere; }
.empty-state { border: 1px dashed #bdcec1; border-radius: 12px; padding: 16px; color: #435f50; }
.empty-state p { margin: 0; font-size: 14px; line-height: 1.6; }

@media (max-width: 560px) {
  .shell { width: calc(100% - 28px); }
  .masthead { min-height: 61px; }
  .hero { min-height: 177px; padding: 29px 20px 49px; border-radius: 17px; }
  .hero p { font-size: 14px; }
  .booth-art { right: -39px; top: 20px; width: 134px; gap: 7px; opacity: .38; }
  .booth-art span { border-radius: 7px; }
  .search-card { margin: -23px 7px 0; padding: 17px 13px 15px; border-radius: 13px; }
  .search-row { gap: 7px; }
  .input-wrap { gap: 8px; padding: 0 5px 0 10px; min-height: 49px; }
  input { min-height: 47px; }
  .clear-button { width: 29px; }
  .search-button { min-width: 61px; padding: 0 10px; }
  .results { margin: 18px 7px 0; }
  .result-item { grid-template-columns: 69px minmax(0, 1fr); gap: 11px; padding: 9px 11px 9px 9px; }
  .booth strong { font-size: 25px; }
  .company { font-size: 15px; }
}
</style>

  <header class="masthead shell">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      招聘双选会
    </div>
  </header>

  <main class="shell">
    <section class="hero" aria-labelledby="page-title">
      <div class="hero-copy">
        <h1 id="page-title">展位查询</h1>
        <p>输入单位全称或名称中的几个字。</p>
      </div>
      <div class="booth-art" aria-hidden="true">
        <span></span><span></span><span></span>
        <span></span><span class="booth-highlight"></span><span></span>
      </div>
    </section>

    <section class="search-card" aria-label="按单位名称查找展位">
      <form id="booth-search" role="search" novalidate>
        <label for="company-input">单位名称</label>
        <div class="search-row">
          <div class="input-wrap">
            <span class="magnifier" aria-hidden="true"></span>
            <input id="company-input" name="company" type="search" placeholder="输入单位名称或关键词" maxlength="100" autocomplete="off" spellcheck="false" enterkeyhint="search" required>
            <button class="clear-button" type="button" id="clear-search" aria-label="清空搜索" hidden>×</button>
          </div>
          <button class="search-button" type="submit">查询</button>
        </div>
        <p class="form-message" id="form-message" role="alert" hidden></p>
      </form>

      <div class="examples" aria-label="搜索示例">
        <span>搜索示例</span>
        <button type="button" data-example="长安汽车">长安汽车</button>
        <button type="button" data-example="瑞幸咖啡">瑞幸咖啡</button>
        <button type="button" data-example="赛力斯">赛力斯</button>
      </div>
      <noscript><p class="form-message">请在支持 JavaScript 的浏览器中打开查询页。</p></noscript>
    </section>

    <section class="results" aria-label="查询结果">
      <p id="result-status" class="result-status" role="status" aria-live="polite" aria-atomic="true"></p>
      <ul id="result-list" class="result-list" hidden></ul>
      <div id="no-results" class="empty-state" hidden>
        <p>试试输入单位名称中的几个字，或联系现场工作人员。</p>
      </div>
    </section>
  </main>

(function () {
  "use strict";

  const form = document.getElementById("booth-search");
  const input = document.getElementById("company-input");
  const clear = document.getElementById("clear-search");
  const message = document.getElementById("form-message");
  const status = document.getElementById("result-status");
  const list = document.getElementById("result-list");
  const empty = document.getElementById("no-results");
  const examples = document.querySelectorAll("[data-example]");

  if (!Array.isArray(window.BOOTH_DIRECTORY)) {
    status.textContent = "展位表加载失败，请刷新页面后重试。";
    return;
  }

  function normalize(text) {
    return text.normalize("NFKC").toLowerCase().replace(/[\s()[\]【】·•・.,、\-—_\u200b]/g, "");
  }

  const directory = window.BOOTH_DIRECTORY.map(function (row, index) {
    return { booth: row[0], company: row[1], nameKey: normalize(row[1]), index: index };
  });
  let composing = false;

  function search(text) {
    const key = normalize(text);
    if (!key) return [];
    const terms = text.trim().split(/\s+/).map(normalize).filter(Boolean);
    const matches = [];
    directory.forEach(function (item) {
      const name = item.nameKey;
      if (name === key) matches.push({ item: item, rank: 0 });
      else if (name.startsWith(key)) matches.push({ item: item, rank: 1 });
      else if (name.includes(key)) matches.push({ item: item, rank: 2 });
      else if (terms.length > 1 && terms.every(function (term) { return name.includes(term); })) {
        matches.push({ item: item, rank: 3 });
      }
    });
    return matches.sort(function (a, b) {
      return a.rank - b.rank || a.item.index - b.item.index;
    }).map(function (match) { return match.item; });
  }

  function resultItem(item) {
    const row = document.createElement("li");
    row.className = "result-item";
    const badge = document.createElement("div");
    badge.className = "booth";
    const label = document.createElement("small");
    label.textContent = "展位号";
    const number = document.createElement("strong");
    number.textContent = item.booth;
    badge.append(label, number);
    const name = document.createElement("p");
    name.className = "company";
    name.textContent = item.company;
    row.append(badge, name);
    return row;
  }

  function render() {
    const value = input.value;
    clear.hidden = value.length === 0;
    message.hidden = true;
    input.removeAttribute("aria-invalid");
    list.textContent = "";
    list.hidden = true;
    empty.hidden = true;

    if (!normalize(value)) {
      status.textContent = "已收录 " + directory.length + " 家参会单位";
      return;
    }

    const matches = search(value);
    if (!matches.length) {
      status.textContent = "未找到匹配的单位";
      empty.hidden = false;
      return;
    }

    const fragment = document.createDocumentFragment();
    matches.forEach(function (item) { fragment.appendChild(resultItem(item)); });
    list.appendChild(fragment);
    list.hidden = false;
    status.textContent = "找到 " + matches.length + " 家单位";
  }

  input.addEventListener("compositionstart", function () { composing = true; });
  input.addEventListener("compositionend", function () { composing = false; render(); });
  input.addEventListener("input", function (event) { if (!composing && !event.isComposing) render(); });
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    if (composing) return;
    render();
    if (!normalize(input.value)) {
      input.setAttribute("aria-invalid", "true");
      message.textContent = "请输入单位名称。";
      message.hidden = false;
      input.focus();
      return;
    }
    input.blur();
  });
  clear.addEventListener("click", function () { input.value = ""; render(); input.focus(); });
  examples.forEach(function (button) {
    button.addEventListener("click", function () { input.value = button.dataset.example; render(); });
  });

  render();
}());

(function () {
  "use strict";

  const title = document.querySelector(".masthead .brand");
  const holdDuration = 1600;
  const moveTolerance = 12;
  let press = null;

  title.addEventListener("pointerdown", function (event) {
    if (!event.isPrimary || event.button !== 0) return;
    press = {
      pointerId: event.pointerId,
      x: event.clientX,
      y: event.clientY,
      startTime: event.timeStamp
    };
  });

  function cancelPress(event) {
    if (press && press.pointerId === event.pointerId) press = null;
  }

  function hasMoved(event) {
    return Math.hypot(event.clientX - press.x, event.clientY - press.y) > moveTolerance;
  }

  title.addEventListener("pointermove", function (event) {
    if (press && press.pointerId === event.pointerId && hasMoved(event)) cancelPress(event);
  });
  title.addEventListener("pointercancel", cancelPress);
  title.addEventListener("pointerleave", cancelPress);
  title.addEventListener("contextmenu", function (event) {
    if (press) event.preventDefault();
  });

  title.addEventListener("pointerup", function (event) {
    if (!press || press.pointerId !== event.pointerId) return;
    const heldTitle = !hasMoved(event) && event.timeStamp - press.startTime >= holdDuration;
    cancelPress(event);
    if (heldTitle) {
      window.location.assign("https://github.com/liliqq13/job-fair-booth/actions/workflows/add-exhibitor.yml");
    }
  });
}());
